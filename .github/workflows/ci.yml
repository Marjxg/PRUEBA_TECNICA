name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependencias
        working-directory: ./React/frontend
        run: npm ci

      - name: Ejecutar linter
        working-directory: ./React/frontend
        run: npm run lint

      - name: Compilar React
        working-directory: ./React/frontend
        run: npm run build

  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        working-directory: ./python
        run: python -m pip install -r requirements.txt

      - name: Verificar importación de FastAPI
        working-directory: ./python
        run: python -c "from main import app; print('FastAPI OK')"
      
      - name: Ejecutar pruebas
        working-directory: ./python
        run: python -m pytest