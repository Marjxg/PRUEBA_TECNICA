name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependencias
        working-directory: ./React/frontend
        run: npm ci

      - name: Ejecutar linter
        working-directory: ./React/frontend
        run: npm run lint

      - name: Compilar React
        working-directory: ./React/frontend
        run: npm run build

  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        working-directory: ./python
        run: python -m pip install -r requirements.txt

      - name: Verificar importación de FastAPI
        working-directory: ./python
        run: python -c "from main import app; print('FastAPI OK')"
      
      - name: Ejecutar pruebas
        working-directory: ./python
        run: python -m pytest
  
  docker:
    runs-on: ubuntu-latest
    needs:
      - frontend
      - backend

    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Construir imagen frontend
        run: docker build -t frontend ./React/frontend

      - name: Construir imagen backend
        run: docker build -t backend ./python
  
  publish:
  runs-on: ubuntu-latest
  needs:
    - docker

  permissions:
    contents: read
    packages: write

  steps:
    - name: Obtener código
      uses: actions/checkout@v4

    - name: Login en GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Guardar owner en minúsculas
      run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

    - name: Construir imagen frontend
      run: |
        docker build \
          -t ghcr.io/${{ env.OWNER_LC }}/prueba-tecnica-frontend:${{ github.sha }} \
          ./React/frontend

    - name: Construir imagen backend
      run: |
        docker build \
          -t ghcr.io/${{ env.OWNER_LC }}/prueba-tecnica-backend:${{ github.sha }} \
          ./python

    - name: Publicar frontend
      run: |
        docker push ghcr.io/${{ env.OWNER_LC }}/prueba-tecnica-frontend:${{ github.sha }}

    - name: Publicar backend
      run: |
        docker push ghcr.io/${{ env.OWNER_LC }}/prueba-tecnica-backend:${{ github.sha }}