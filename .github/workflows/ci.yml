name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependencias
        working-directory: ./react/frontend
        run: npm ci

      - name: Ejecutar linter
        working-directory: ./react/frontend
        run: npm run lint

      - name: Compilar React
        working-directory: ./react/frontend
        run: npm run build